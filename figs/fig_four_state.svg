<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif"><rect width="900" height="720" fill="#ffffff"/><text x="40.0" y="46.0" font-size="22" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">一句话进来，先问三个问题</text><text x="40.0" y="74.0" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">判定器只看两个官方字段：今日价、上一轮价。没有卡就不判，不猜。</text><rect x="40" y="110" width="200" height="88" rx="8" fill="#f3f5f8" stroke="#d8dbe0"/><text x="140.0" y="145.0" font-size="15" fill="#1f2328" font-weight="500" text-anchor="middle" opacity="1.0">AI 的回答</text><text x="140.0" y="170.0" font-size="14" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">「约 7.85 元/升」</text><rect x="300" y="110" width="300" height="88" rx="8" fill="#ffffff" stroke="#0f6e56" stroke-width="1.4"/><text x="320.0" y="146.0" font-size="15" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">Q1  等于今日价？</text><text x="320.0" y="174.0" font-size="13" fill="#0f6e56" font-weight="500" text-anchor="start" opacity="1.0">是 → correct（属实）</text><path d="M240 154 H270 V154 H300" fill="none" stroke="#d8dbe0" stroke-width="1.4"/><path d="M295 154 l6 -4 v8 z" fill="#d8dbe0"/><rect x="660" y="124" width="200" height="60" rx="6" fill="#a8d8c8" opacity="0.55"/><text x="760.0" y="150.0" font-size="14" fill="#0f6e56" font-weight="500" text-anchor="middle" opacity="1.0">correct</text><text x="760.0" y="170.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">属实</text><path d="M600 154 H660" fill="none" stroke="#d8dbe0" stroke-width="1.4"/><rect x="300" y="260" width="300" height="88" rx="8" fill="#ffffff" stroke="#854f0b" stroke-width="1.4"/><text x="320.0" y="296.0" font-size="15" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">Q2  等于上一轮价？</text><text x="320.0" y="324.0" font-size="13" fill="#854f0b" font-weight="500" text-anchor="start" opacity="1.0">是 → stale（过期，不是编造）</text><path d="M240 154 H270 V304 H300" fill="none" stroke="#d8dbe0" stroke-width="1.4"/><path d="M295 304 l6 -4 v8 z" fill="#d8dbe0"/><rect x="660" y="274" width="200" height="60" rx="6" fill="#f6d9a8" opacity="0.55"/><text x="760.0" y="300.0" font-size="14" fill="#854f0b" font-weight="500" text-anchor="middle" opacity="1.0">stale</text><text x="760.0" y="320.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">过期，不是编造</text><path d="M600 304 H660" fill="none" stroke="#d8dbe0" stroke-width="1.4"/><rect x="300" y="410" width="300" height="88" rx="8" fill="#ffffff" stroke="#a32d2d" stroke-width="1.4"/><text x="320.0" y="446.0" font-size="15" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">都不等</text><text x="320.0" y="474.0" font-size="13" fill="#a32d2d" font-weight="500" text-anchor="start" opacity="1.0">→ mismatch（两轮都不是）</text><path d="M240 154 H270 V454 H300" fill="none" stroke="#d8dbe0" stroke-width="1.4"/><path d="M295 454 l6 -4 v8 z" fill="#d8dbe0"/><rect x="660" y="424" width="200" height="60" rx="6" fill="#f2c6c6" opacity="0.55"/><text x="760.0" y="450.0" font-size="14" fill="#a32d2d" font-weight="500" text-anchor="middle" opacity="1.0">mismatch</text><text x="760.0" y="470.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">两轮都不是</text><path d="M600 454 H660" fill="none" stroke="#d8dbe0" stroke-width="1.4"/><rect x="300" y="560" width="300" height="76" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/><text x="320.0" y="592.0" font-size="15" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">Q0  这个城市有 VR 卡吗？</text><text x="320.0" y="618.0" font-size="13" fill="#6b7280" font-weight="500" text-anchor="start" opacity="1.0">没有 → unknown（存疑，不进分母）</text><path d="M140 198 V598 H300" fill="none" stroke="#d8dbe0" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="660" y="574" width="200" height="48" rx="6" fill="#eef0f3"/><text x="760.0" y="604.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">不降级、不借邻省价</text><text x="40.0" y="690.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">四态的价值在 stale 单独成立：它把「曾经是真的」和「从来没有过」分开，误判成本从「冤枉」降到「提醒」。</text></svg>