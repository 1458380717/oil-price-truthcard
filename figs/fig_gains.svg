<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif"><rect width="1200" height="880" fill="#ffffff"/><text x="40.0" y="48.0" font-size="23" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">元宝搜索解决了三个问题，第四个没解决</text><text x="40.0" y="76.0" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">同一批城市、同一个 query，只换检索模式。左边是普通检索（Mode=0），右边是权威 VR 卡（Mode=1）。</text><text x="268.0" y="108.0" font-size="13" fill="#6b7280" font-weight="500" text-anchor="start" opacity="1.0">普通检索：45 个数字，说不清是哪天的</text><text x="732.0" y="108.0" font-size="13" fill="#185FA5" font-weight="500" text-anchor="start" opacity="1.0">元宝 VR 卡：字段带生效日，两个数能互证</text><rect x="40" y="126" width="200" height="178" rx="8" fill="#f3f5f8" stroke="#d8dbe0"/><text x="66.0" y="172.0" font-size="28" fill="#6b7280" font-weight="500" text-anchor="start" opacity="1.0">①</text><text x="96.0" y="166.0" font-size="17" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">分不清</text><text x="96.0" y="192.0" font-size="17" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">过期和编造</text><text x="66.0" y="258.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">问题</text><rect x="258" y="126" width="445" height="178" rx="8" fill="#fff" stroke="#f2c6c6"/><rect x="258" y="126" width="4" height="178" rx="2" fill="#a32d2d"/><text x="284.0" y="176.0" font-size="34" fill="#a32d2d" font-weight="500" text-anchor="start" opacity="1.0">40%</text><text x="284.0" y="210.0" font-size="14" fill="#1f2328" font-weight="400" text-anchor="start" opacity="1.0">首答是今日价</text><text x="284.0" y="242.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">其余 60% 是别的日子，</text><text x="284.0" y="266.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">从结果里看不出来</text><rect x="722" y="126" width="438" height="178" rx="8" fill="#fff" stroke="#b6d4f4"/><rect x="722" y="126" width="4" height="178" rx="2" fill="#185FA5"/><text x="748.0" y="176.0" font-size="34" fill="#185FA5" font-weight="500" text-anchor="start" opacity="1.0">15/15</text><text x="748.0" y="210.0" font-size="14" fill="#1f2328" font-weight="400" text-anchor="start" opacity="1.0">今日价 + 上一轮价都给</text><text x="748.0" y="242.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">8.89 等于上一轮</text><text x="748.0" y="266.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">→ 判 stale，不算编造</text><rect x="40" y="318" width="200" height="178" rx="8" fill="#f3f5f8" stroke="#d8dbe0"/><text x="66.0" y="364.0" font-size="28" fill="#6b7280" font-weight="500" text-anchor="start" opacity="1.0">②</text><text x="96.0" y="358.0" font-size="17" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">抽取</text><text x="96.0" y="384.0" font-size="17" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">噪声</text><text x="66.0" y="450.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">问题</text><rect x="258" y="318" width="445" height="178" rx="8" fill="#fff" stroke="#f2c6c6"/><rect x="258" y="318" width="4" height="178" rx="2" fill="#a32d2d"/><text x="284.0" y="368.0" font-size="34" fill="#a32d2d" font-weight="500" text-anchor="start" opacity="1.0">0.28</text><text x="284.0" y="402.0" font-size="14" fill="#1f2328" font-weight="400" text-anchor="start" opacity="1.0">郑州首答抽出的"价格"</text><text x="284.0" y="434.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">100 条里 36 条摘要</text><text x="284.0" y="458.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">压根没写价格</text><rect x="722" y="318" width="438" height="178" rx="8" fill="#fff" stroke="#b6d4f4"/><rect x="722" y="318" width="4" height="178" rx="2" fill="#185FA5"/><text x="748.0" y="368.0" font-size="34" fill="#185FA5" font-weight="500" text-anchor="start" opacity="1.0">3 字段</text><text x="748.0" y="402.0" font-size="14" fill="#1f2328" font-weight="400" text-anchor="start" opacity="1.0">数值 / 生效日 / 来源站点</text><text x="748.0" y="434.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">不用正则，不用二次核对</text><text x="748.0" y="458.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">89 次调用 41 秒跑完</text><rect x="40" y="510" width="200" height="178" rx="8" fill="#f3f5f8" stroke="#d8dbe0"/><text x="66.0" y="556.0" font-size="28" fill="#6b7280" font-weight="500" text-anchor="start" opacity="1.0">③</text><text x="96.0" y="550.0" font-size="17" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">来源</text><text x="96.0" y="576.0" font-size="17" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">不可追</text><text x="66.0" y="642.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">问题</text><rect x="258" y="510" width="445" height="178" rx="8" fill="#fff" stroke="#f2c6c6"/><rect x="258" y="510" width="4" height="178" rx="2" fill="#a32d2d"/><text x="284.0" y="560.0" font-size="34" fill="#a32d2d" font-weight="500" text-anchor="start" opacity="1.0">11 组</text><text x="284.0" y="594.0" font-size="14" fill="#1f2328" font-weight="400" text-anchor="start" opacity="1.0">同标题被站点互搬</text><text x="284.0" y="626.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">有误率 76.7% → 79.2%</text><text x="284.0" y="650.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">多查来源反而更糟</text><rect x="722" y="510" width="438" height="178" rx="8" fill="#fff" stroke="#b6d4f4"/><rect x="722" y="510" width="4" height="178" rx="2" fill="#185FA5"/><text x="748.0" y="560.0" font-size="34" fill="#185FA5" font-weight="500" text-anchor="start" opacity="1.0">同价</text><text x="748.0" y="594.0" font-size="14" fill="#1f2328" font-weight="400" text-anchor="start" opacity="1.0">来源与生效日跟着价格走</text><text x="748.0" y="626.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">被十家站点搬</text><text x="748.0" y="650.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">还是那一个价</text><rect x="40" y="702" width="1120" height="128" rx="8" fill="#fdf6ec" stroke="#f6d9a8"/><text x="66.0" y="742.0" font-size="26" fill="#854f0b" font-weight="500" text-anchor="start" opacity="1.0">④</text><text x="96.0" y="740.0" font-size="17" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">没解决：覆盖不全</text><text x="66.0" y="776.0" font-size="14" fill="#1f2328" font-weight="400" text-anchor="start" opacity="1.0">上海 95 号、成都 0 号柴油返回 0 条卡；27 个垂类探针只命中 14 个，oil 这一类命中 1/3。</text><text x="66.0" y="804.0" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">所以我从头到尾只敢说 92 号汽油。工具给的是对照值，判决还得自己写，这是它不管的部分。</text><text x="40.0" y="856.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">数据：data/bigtest.json（assert_verify / web_freshness）、data/compare.json；普通检索 45 次首答，VR 卡 15 城 15 次双字段</text></svg>