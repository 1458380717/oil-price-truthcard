<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif"><rect width="1200" height="520" fill="#ffffff"/><text x="40.0" y="44.0" font-size="22" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">去重之后，错误率反而升了</text><text x="40.0" y="72.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">100 条网页摘要里有 11 组是同标题的跨站转载。去掉转载样本，分母缩小，错误率从 76.7% 升到 79.2%。</text><text x="40.0" y="140.0" font-size="15" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">① 未去重：100 条原始样本</text><text x="40.0" y="166.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">60 / 100 条有明确价格</text><rect x="40" y="186" width="440" height="54" rx="4" fill="#eef0f3"/><rect x="40" y="186" width="337.3" height="54" rx="4" fill="#a32d2d" opacity="0.85"/><text x="52.0" y="220.0" font-size="14" fill="#ffffff" font-weight="500" text-anchor="start" opacity="1.0">有误 46</text><text x="494.0" y="220.0" font-size="20" fill="#a32d2d" font-weight="500" text-anchor="start" opacity="1.0">76.7%</text><text x="40.0" y="274.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">分母 60 = 100 − 40 条摘要里没有明确价格</text><text x="620.0" y="140.0" font-size="15" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">② 按标题去重：89 条独立内容</text><text x="620.0" y="166.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">53 / 89 条有明确价格</text><rect x="620" y="186" width="440" height="54" rx="4" fill="#eef0f3"/><rect x="620" y="186" width="348.7" height="54" rx="4" fill="#a32d2d" opacity="0.85"/><text x="632.0" y="220.0" font-size="14" fill="#ffffff" font-weight="500" text-anchor="start" opacity="1.0">有误 42</text><text x="1074.0" y="220.0" font-size="20" fill="#a32d2d" font-weight="500" text-anchor="start" opacity="1.0">79.2%</text><text x="620.0" y="274.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">分母 53 = 89 − 36 条无价格；11 组转载合并为首条</text><path d="M520 213 H596" fill="none" stroke="#1f2328" stroke-width="1.4"/><path d="M590 208 l8 5 -8 5 z" fill="#1f2328"/><text x="558.0" y="200.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">去重</text><text x="40.0" y="356.0" font-size="14" fill="#1f2328" font-weight="500" text-anchor="start" opacity="1.0">为什么这条值得写：</text><text x="40.0" y="384.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">如果错误率是靠「多抓几条」堆出来的，去重后应该下降。它上升了，说明这 100 条里的错误不是样本噪声，而是同一个错误被搬运了 11 次。</text><text x="40.0" y="412.0" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">换句话说，普通搜索里那些看起来「多源互证」的结果，很可能是同一篇文章的镜像。</text><text x="40.0" y="460.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">数据：data/bigtest.json → web_freshness（100 条 = 10 城 × 10 条）</text></svg>